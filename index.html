<style>
:root{
  --bg:#171512; --card:#201D19; --inp:#2A2621; --ink:#F1ECE2; --soft:#8E8779;
  --line:#38332C; --acc:#D48A5F; --pos:#8FA06C; --neg:#C0685A;
  --sans:'Oswald', system-ui, -apple-system, sans-serif;
  --mono:'Montserrat', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;padding-bottom:40px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wrap{max-width:28rem;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}
.xs{font-size:11px}.sm{font-size:12px}
.soft{color:var(--soft)}.acc{color:var(--acc)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.col{display:flex;flex-direction:column;gap:12px}
.col8{display:flex;flex-direction:column;gap:8px}

header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.grid{background-image:linear-gradient(0deg,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:18px 18px;padding:18px 0 12px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between}
.title{font-family:var(--sans);font-weight:700;font-size:24px;line-height:1.1}
.tright{text-align:right}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:12px}
.segbtn{flex:1;padding:9px 0;border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--soft)}
.segbtn.on{background:var(--inp);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:20px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--soft);flex-shrink:0}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.icobtn{width:30px;height:30px;flex-shrink:0;border-radius:20px;border:1px solid var(--soft);color:var(--soft);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.icobtn.on{border-color:var(--acc);color:var(--acc)}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 16px}
.pt{padding-top:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.exname{font-family:var(--sans);font-weight:500;font-size:15px}
.trends{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.trend{font-family:var(--mono);font-size:10px;white-space:nowrap}
.trend .lbl{color:var(--soft);font-size:9px;margin-right:3px}
.meta{margin-bottom:10px;line-height:1.5}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:8px}
.idx{width:14px}
.num{width:60px;text-align:center;padding:7px 4px;border:1px solid var(--line);border-radius:4px;background:var(--inp);font-family:var(--mono);font-size:14px}
.mini{color:var(--soft);font-size:18px;padding:0 6px}
.daterow{display:flex;align-items:center;gap:8px;margin-top:10px}
.dateinp{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--inp);font-family:var(--mono);font-size:12px;color:var(--ink)}
.linkbtn{font-family:var(--mono);font-size:11px;color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:10px}
.ghost{flex:1;padding:9px 0;border:1px dashed var(--soft);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--soft)}
.save{flex:1;padding:9px 0;border-radius:4px;font-family:var(--mono);font-size:12px;background:var(--acc);color:var(--card)}
.save.on{background:var(--pos)}
.solid{width:100%;padding:9px 0;border-radius:4px;font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--card)}
.line{width:100%;padding:9px 0;border-radius:4px;border:1px solid var(--soft);font-family:var(--mono);font-size:12px}

.editrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.editrow .name{font-size:16px;letter-spacing:.3px}
.editrow .acts{display:flex;gap:2px;flex-shrink:0}
.editrow .acts button{padding:4px 6px;color:var(--soft);font-size:15px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-bottom:12px}
.searchbox input{flex:1;font-size:16px;letter-spacing:.3px;min-width:0}
.results{margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:16px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:none}

.pcard{background:var(--card);border:1px solid var(--line);border-radius:6px}
.phead{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px}
.pbody{border-top:1px solid var(--line);padding:0 12px 12px}
.chartbox{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:10px 4px;margin:8px 0 12px}
.hrow2{display:flex;align-items:center;justify-content:space-between;background:var(--inp);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.spark{width:72px;height:32px;flex-shrink:0}
.caret{color:var(--soft);font-size:16px;margin-left:8px;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.empty{text-align:center;padding:32px 0;color:var(--soft);font-family:var(--mono);font-size:13px}

.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:28rem;background:var(--bg);border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.wmrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px}
.wmrow.drag{border-color:var(--acc);background:var(--inp);box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;z-index:2}
.handle{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--soft);touch-action:none;cursor:grab;font-size:16px;flex-shrink:0}
.wmname{flex:1;min-width:0;padding:6px 8px;font-size:16px;border:1px solid transparent;border-radius:4px}
.wmname:focus{border-color:var(--line);background:var(--inp)}
.danger{padding:5px 10px;border-radius:4px;background:var(--neg);color:var(--bg);font-family:var(--mono);font-size:11px}
textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--inp);font-family:var(--mono);font-size:11px;resize:vertical}
</style>
</head>

/* ---------- хранилище (localStorage, работает офлайн) ---------- */
function readKey(k) {
  try { var raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function hasLogs(d) { return d && d.logs && d.logs.length ? d.logs.length : 0; }
function newestDate(d) {
  return (d && d.logs ? d.logs : []).reduce(function (m, l) { return l.date > m ? l.date : m; }, "");
}
var BROKEN_BUNDLE_IDS = ["import-2026-09-24"];
// вшитый набор подставляется, только если он ничего не затирает
function mayApplyBundle(d) {
  if (!hasLogs(d)) return true;
  if (BROKEN_BUNDLE_IDS.indexOf(d.bundleId) >= 0) return true;
  if (d.bundleId === BUNDLE_ID) return false;
  return newestDate(d) <= newestDate(BUNDLED) && d.logs.length <= BUNDLED.logs.length;
}
function loadData() {
  var d = readKey(DKEY);
  var applied = mayApplyBundle(d);
  if (applied) {
    d = JSON.parse(JSON.stringify(BUNDLED));
    d.bundleId = BUNDLE_ID;
    var clean = JSON.parse(JSON.stringify(d));
    clean.savedAt = todayISO();
    try { localStorage.setItem(BKEY, JSON.stringify(clean)); } catch (e) {}
  }
  var b = readKey(BKEY);
  if (!applied && hasLogs(b) > hasLogs(d)) restoreOffer = { count: b.logs.length, at: b.savedAt || null, current: hasLogs(d) };
  return { exercises: d.exercises || [], logs: d.logs || [], weeks: d.weeks || [] };
}
function restoreBackup() {
  var b = readKey(BKEY);
  if (!hasLogs(b)) return false;
  S = { exercises: b.exercises || [], logs: b.logs || [], weeks: b.weeks || [] };
  restoreOffer = null;
  drafts = {};
  persist();
  render();
  return true;
}
function persist() {
  var payload = { exercises: S.exercises, logs: S.logs, weeks: S.weeks, bundleId: BUNDLE_ID, updatedAt: Date.now() };
  try { localStorage.setItem(DKEY, JSON.stringify(payload)); } catch (e) {}
  // резервная копия: обновляем, только если записей не стало меньше
  var b = readKey(BKEY);
  if (hasLogs(b) <= S.logs.length) {
    payload.savedAt = todayISO();
    try { localStorage.setItem(BKEY, JSON.stringify(payload)); } catch (e) {}
  }
}
function loadUI() {
  var u = null;
  try { var raw = localStorage.getItem(UKEY); if (raw) u = JSON.parse(raw); } catch (e) {}
  var last = S.weeks[S.weeks.length - 1];
  var weekId = u && S.weeks.some(function (w) { return w.id === u.weekId; }) ? u.weekId : last ? last.id : null;
  return {
    tab: u && ["weeks", "progress", "base"].indexOf(u.tab) >= 0 ? u.tab : "weeks",
    weekId: weekId,
    day: u && [1, 2, 3].indexOf(u.day) >= 0 ? u.day : 1,
    editing: false, addQuery: "", query: "", group: null, openId: null, metric: "volume", newGroup: GROUPS[0]
  };
}
function persistUI() {
  try { localStorage.setItem(UKEY, JSON.stringify({ tab: UI.tab, weekId: UI.weekId, day: UI.day })); } catch (e) {}
}

/* ---------- резервные копии ---------- */
function backupText() { return JSON.stringify({ exercises: S.exercises, logs: S.logs, weeks: S.weeks }); }
function backupName() { return "progressiya-" + todayISO() + ".json"; }
function markExport() { try { localStorage.setItem(EKEY, todayISO()); } catch (e) {} }
function lastExport() { try { return localStorage.getItem(EKEY); } catch (e) { return null; } }
function daysSinceExport() {
  var v = lastExport();
  if (!v) return 999;
  return Math.round((new Date(todayISO()) - new Date(v)) / 86400000);
}
function downloadBackup() {
  try {
    var url = URL.createObjectURL(new Blob([backupText()], { type: "application/json" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = backupName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    markExport();
    ioMsg = "файл сохранён: " + backupName();
  } catch (e) {
    ioMsg = "не получилось сохранить файл — используй экспорт текстом";
  }
  render();
}
function shareBackup() {
  try {
    var file = new File([backupText()], backupName(), { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Прогрессия", text: "Копия журнала от " + todayISO() }).then(
        function () { markExport(); ioMsg = "копия отправлена"; render(); },
        function () {}
      );
      return;
    }
  } catch (e) {}
  downloadBackup();
}

/* ---------- графики ---------- */
function chartSVG(vals, labels, color, steps, dotColors) {
  var W = 320, H = 180, PL = 36, PR = 12, PT = 12, PB = 26;
  if (!vals.length) return "";
  var all = steps && steps.length ? vals.concat(steps) : vals;
  var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  var span = max - min || Math.max(1, max * 0.1);
  var lo = min - span * 0.2, hi = max + span * 0.2;
  var X = function (i) { return vals.length < 2 ? PL + (W - PL - PR) / 2 : PL + (i * (W - PL - PR)) / (vals.length - 1); };
  var Y = function (v) { return PT + ((hi - v) / (hi - lo)) * (H - PT - PB); };
  var out = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="180" preserveAspectRatio="xMidYMid meet" font-family="Montserrat, system-ui, sans-serif">';
  [0, 0.5, 1].forEach(function (t) {
    var v = lo + (hi - lo) * t, y = Y(v);
    out += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#38332C" stroke-width="1"/>';
    out += '<text x="' + (PL - 6) + '" y="' + (y + 3) + '" fill="#8E8779" font-size="9" text-anchor="end">' + r1(v) + "</text>";
  });
  if (steps && steps.length === vals.length) {
    var sp = [];
    steps.forEach(function (v, i) {
      if (i && steps[i - 1] !== v) sp.push(X(i) + "," + Y(steps[i - 1]));
      sp.push(X(i) + "," + Y(v));
    });
    out += '<polyline points="' + sp.join(" ") + '" fill="none" stroke="#8FA06C" stroke-width="1.5" stroke-dasharray="4 3"/>';
  }
  var pts = vals.map(function (v, i) { return X(i) + "," + Y(v); }).join(" ");
  out += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach(function (v, i) {
    out += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="' + (dotColors && dotColors[i] ? 3.4 : 2.6) + '" fill="' +
      (dotColors && dotColors[i] ? dotColors[i] : color) + '"/>';
  });
  var idxs = vals.length <= 4 ? vals.map(function (_, i) { return i; }) : [0, Math.floor((vals.length - 1) / 2), vals.length - 1];
  idxs.forEach(function (i) {
    var anchor = i === 0 ? "start" : i === vals.length - 1 ? "end" : "middle";
    out += '<text x="' + X(i) + '" y="' + (H - 8) + '" fill="#8E8779" font-size="9" text-anchor="' + anchor + '">' + esc(labels[i]) + "</text>";
  });
  return out + "</svg>";
}
function sparkSVG(vals) {
  if (vals.length < 2) return "";
  var W = 72, H = 32, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = max - min || 1;
  var pts = vals.map(function (v, i) { return (i * W) / (vals.length - 1) + "," + (H - 3 - ((v - min) / span) * (H - 6)); }).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '"><polyline points="' + pts + '" fill="none" stroke="#D48A5F" stroke-width="1.5"/></svg>';
}

/* ---------- шапка ---------- */
function renderHead() {
  var today = new Date().toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "short" });
  var on = navigator.onLine;
  document.getElementById("head").innerHTML =
    '<div><div class="mono xs soft" style="letter-spacing:1px">журнал тренировок</div><div class="title">Прогрессия</div></div>' +
    '<div class="tright"><div class="mono xs ' + (on ? "soft" : "acc") + '">' + (on ? "сегодня" : "офлайн") + "</div>" +
    '<div class="mono sm">' + today + "</div></div>";
  document.getElementById("tabs").innerHTML = [["weeks", "Тренировки"], ["progress", "Прогресс"], ["base", "База"]]
    .map(function (t) { return '<button class="segbtn' + (UI.tab === t[0] ? " on" : "") + '" data-act="tab:' + t[0] + '">' + t[1] + "</button>"; })
    .join("");
}

/* ---------- вкладка «Тренировки» ---------- */
function currentWeek() {
  var w = null;
  S.weeks.forEach(function (x) { if (x.id === UI.weekId) w = x; });
  if (!w) w = S.weeks[S.weeks.length - 1] || null;
  if (w) UI.weekId = w.id;
  return w;
}
function dayList() {
  var w = currentWeek();
  return (w && w.days && w.days[UI.day]) || [];
}
function trendHTML(d, label) {
  if (d === null || d === undefined) return "";
  var cls = "soft", txt = "=", arrow = "→";
  if (d > 0.05) { cls = "pos"; txt = "+" + r1(d); arrow = "↗"; }
  else if (d < -0.05) { cls = "neg"; txt = "" + r1(d); arrow = "↘"; }
  return '<span class="trend ' + cls + '"><span class="lbl">' + label + "</span>" + arrow + " " + txt + "</span>";
}
/* сессия = дата тренировки; неделя и день — только ярлыки */
function sessionDate(w, day) {
  if (!w) return todayISO();
  if (w.dates && w.dates[day]) return w.dates[day];
  var ds = S.logs.filter(function (l) { return l.weekId === w.id && l.day === day; })
                 .map(function (l) { return l.date; }).sort();
  return ds.length ? ds[ds.length - 1] : todayISO();
}
function curDate() { return sessionDate(currentWeek(), UI.day); }
function setSessionDate(date) {
  var w = currentWeek();
  if (!w) return;
  if (!w.dates) w.dates = {};
  w.dates[UI.day] = date;
}
function draftKey(exId) { return curDate() + "|" + exId; }
function currentEntry(exId) {
  var d = curDate(), f = null;
  S.logs.forEach(function (l) { if (l.exerciseId === exId && l.date === d) f = l; });
  return f;
}
function prevEntry(exId) {
  var d = curDate();
  var list = entriesFor(exId).filter(function (l) { return l.date < d; });
  return list[list.length - 1] || null;
}
function getDraft(exId) {
  var k = draftKey(exId);
  if (!drafts[k]) {
    var cur = currentEntry(exId);
    drafts[k] = cur
      ? { sets: cur.sets.map(function (s) { return { weight: String(s.weight), reps: String(s.reps) }; }), light: !!cur.light, saved: true }
      : { sets: [{ weight: "", reps: "" }], light: false, saved: false };
  }
  return drafts[k];
}

/* блоки двойной прогрессии: подряд идущие тренировки на одном рабочем весе */
function topWorkingSet(e) {
  if (!e || !e.sets || !e.sets.length) return null;
  return e.sets.reduce(function (b, x) {
    return !b || x.weight > b.weight || (x.weight === b.weight && x.reps > b.reps) ? x : b;
  }, null);
}
function blocksFor(entries) {
  var out = [];
  entries.forEach(function (e) {
    var top = topWorkingSet(e);
    if (!top) return;
    var last = out[out.length - 1];
    if (last && last.weight === top.weight) {
      last.to = top.reps;
      last.peak = Math.max(last.peak, topE(e));
      last.end = e.date;
      last.count++;
    } else {
      out.push({ weight: top.weight, from: top.reps, to: top.reps, peak: topE(e), start: e.date, end: e.date, count: 1 });
    }
  });
  return out;
}
function blocksHTML(entries) {
  var b = blocksFor(entries);
  if (b.length < 2) return "";
  return '<div class="mono soft" style="font-size:10px;margin:4px 0 6px">блоки по рабочему весу (пик = лучший e1ПМ). Лёгкие записи и разгрузочные недели сюда не входят.</div>' +
    '<div class="col8" style="margin-bottom:12px">' + b.slice().reverse().map(function (x, i, arr) {
      var prev = arr[i + 1];
      var d = prev ? r1(x.peak - prev.peak) : null;
      return '<div class="hrow2"><span class="mono sm">' + x.weight + " кг · " +
        (x.from === x.to ? x.to : x.from + "→" + x.to) + " повт</span>" +
        '<span class="mono sm">пик ' + r1(x.peak) +
        (d === null ? "" : ' <span class="' + (d > 0 ? "pos" : d < 0 ? "neg" : "soft") + '">' + (d > 0 ? "+" : "") + d + "</span>") +
        "</span></div>";
    }).join("") + "</div>";
}
// застой: последний ЗАКРЫТЫЙ блок не превзошёл предыдущий
function stagnation(entries) {
  var b = blocksFor(entries);
  if (b.length < 3) return null;
  var last = b[b.length - 2], prev = b[b.length - 3];
  if (last.peak > prev.peak + 0.05) return null;
  return { weight: last.weight, prevWeight: prev.weight, d: r1(last.peak - prev.peak) };
}
function stagnationHTML(entries) {
  var st = stagnation(entries);
  if (!st) return "";
  return '<div class="neg">блок ' + st.weight + " кг закрыт не выше прошлого (" + (st.d > 0 ? "+" : "") + st.d + ")</div>";
}
function cardHTML(ex) {
  var all = entriesFor(ex.id), cur = currentEntry(ex.id);
  var prev = prevEntry(ex.id);
  var d = getDraft(ex.id);
  var tE = cur && prev ? r1(topE(cur) - topE(prev)) : null;
  var tV = cur && prev ? Math.round(vol(cur) - vol(prev)) : null;
  var best = bestSet(all);
  var rows = d.sets.map(function (s, i) {
    return '<div class="setrow"><span class="idx mono xs soft">' + (i + 1) + "</span>" +
      '<input class="num" inputmode="decimal" placeholder="кг" value="' + esc(s.weight) + '" data-inp="w:' + ex.id + ":" + i + '">' +
      '<span class="mono soft">×</span>' +
      '<input class="num" inputmode="decimal" placeholder="повт" value="' + esc(s.reps) + '" data-inp="r:' + ex.id + ":" + i + '">' +
      '<button class="mini" data-act="delset:' + ex.id + ":" + i + '">−</button></div>';
  }).join("");
  return '<div class="card" id="card-' + ex.id + '">' +
    '<div class="cardhead"><div class="exname">' + esc(ex.name) + "</div>" +
    '<div class="trends">' + trendHTML(tE, "e1ПМ") + trendHTML(tV, "объём") + "</div></div>" +
    '<div class="mono xs soft meta"><div>' +
      (prev ? "пред. раз (" + fmtDate(prev.date) + "): " + sumSets(prev) : "предыдущих записей нет") + "</div>" +
      (best ? '<div class="acc">макс: ' + best.weight + "×" + best.reps + " · " + fmtDate(best.date) + "</div>" : "") +
      stagnationHTML(blockEntries(ex.id)) +
    "</div>" +
    '<div class="chips" style="margin-bottom:10px">' +
      '<button class="chip' + (d.light ? "" : " on") + '" data-act="mode:' + ex.id + ':work">рабочая</button>' +
      '<button class="chip' + (d.light ? " on" : "") + '" data-act="mode:' + ex.id + ':light">лёгкая</button>' +
    "</div>" +
    '<div class="sets">' + rows + "</div>" +
    '<div class="btns"><button class="ghost" data-act="addset:' + ex.id + '">+ подход</button>' +
    '<button class="save' + (d.saved ? " on" : "") + '" data-act="save:' + ex.id + '">' + (d.saved ? "✓ сохранено" : "сохранить") + "</button></div></div>";
}
function viewWeeks() {
  var w = currentWeek();
  var list = dayList();
  var exs = list.map(exById).filter(Boolean);
  var h = '<div class="chips" style="margin-bottom:12px">' +
    S.weeks.map(function (x) { return '<button class="chip' + (x.id === UI.weekId ? " on" : "") + '" data-act="week:' + x.id + '">' + esc(x.label) + "</button>"; }).join("") +
    '<button class="icobtn" data-act="addweek">+</button><button class="icobtn" data-act="manage">≡</button></div>';
  h += '<div class="rowbetween"><div class="chips">' +
    [1, 2, 3].map(function (d) { return '<button class="chip' + (UI.day === d ? " on" : "") + '" data-act="day:' + d + '">День ' + d + "</button>"; }).join("") +
    '</div><button class="icobtn' + (UI.editing ? " on" : "") + '" data-act="edit">✎</button></div>';

  if (!w) return h + '<div class="empty">недель нет — нажми +</div>';

  var sd = curDate();
  h += '<div class="daterow" style="margin:-4px 0 14px"><span class="mono xs soft">дата тренировки</span>' +
    '<input type="date" class="dateinp" id="sessdate" value="' + esc(sd) + '">' +
    (sd !== todayISO() ? '<button class="linkbtn" data-act="setToday">сегодня</button>' : "") + "</div>";

  if (UI.editing) {
    h += '<div class="col8">' + exs.map(function (ex, i) {
      return '<div class="editrow"><span class="name">' + esc(ex.name) + '</span><span class="acts">' +
        '<button data-act="up:' + i + '">↑</button><button data-act="down:' + i + '">↓</button>' +
        '<button class="neg" data-act="rmex:' + ex.id + '">✕</button></span></div>';
    }).join("") + "</div>";
    h += '<div style="margin-top:12px"><div class="searchbox"><span class="soft">🔍</span>' +
      '<input id="addq" placeholder="Добавить упражнение в этот день…" value="' + esc(UI.addQuery) + '"></div>' +
      '<div id="addres">' + addResultsHTML() + "</div></div>";
    return h;
  }
  h += '<div class="col">' + (exs.length ? exs.map(cardHTML).join("") : '<div class="empty">для этого дня нет упражнений — нажми ✎</div>') + "</div>";
  return h;
}
function addResultsHTML() {
  var q = UI.addQuery.trim().toLowerCase();
  if (!q) return "";
  var list = dayList();
  var res = S.exercises.filter(function (ex) { return list.indexOf(ex.id) < 0 && ex.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 6);
  if (!res.length) return "";
  return '<div class="results">' + res.map(function (ex) { return '<button data-act="addex:' + ex.id + '">' + esc(ex.name) + "</button>"; }).join("") + "</div>";
}

/* ---------- вкладка «Прогресс» ---------- */
function sessionData() {
  var first = {};
  S.logs.slice().sort(function (a, b) { return a.date > b.date ? 1 : -1; }).forEach(function (l) {
    if (first[l.exerciseId] === undefined) first[l.exerciseId] = topE(l);
  });
  var by = {};
  S.logs.filter(function (l) { return l.weekId; }).forEach(function (l) {
    var d = by[l.date] || (by[l.date] = { date: l.date, volume: 0, sets: 0, ratios: [], easy: 0, total: 0 });
    d.volume += vol(l);
    d.sets += (l.sets || []).length;
    d.total++;
    if (l.light || isDeloadWeek(l.weekId)) d.easy++;
    if (first[l.exerciseId] > 0) d.ratios.push((topE(l) / first[l.exerciseId]) * 100);
  });
  return Object.keys(by).sort().slice(-24).map(function (k) {
    var d = by[k];
    return {
      easy: d.total > 0 && d.easy * 2 >= d.total,
      date: fmtDate(d.date),
      volume: Math.round(d.volume),
      sets: d.sets,
      index: d.ratios.length ? r1(d.ratios.reduce(function (a, b) { return a + b; }, 0) / d.ratios.length) : 100
    };
  });
}
function overallHTML() {
  var data = sessionData();
  if (data.length < 2) return "";
  var m = METRICS.filter(function (x) { return x.id === UI.metric; })[0];
  var vals = data.map(function (d) { return d[UI.metric]; });
  var labels = data.map(function (d) { return d.date; });
  var dots = data.map(function (d) { return d.easy ? "#8FA06C" : null; });
  var hasEasy = dots.some(function (x) { return x; });
  var avg = function (arr) { return arr.length ? arr.reduce(function (s, d) { return s + (d[UI.metric] || 0); }, 0) / arr.length : 0; };
  var last3 = data.slice(-3), prev3 = data.slice(-6, -3);
  var delta = prev3.length && avg(prev3) ? r1(((avg(last3) - avg(prev3)) / avg(prev3)) * 100) : null;
  var dcls = delta === null ? "soft" : delta > 1 ? "pos" : delta < -1 ? "neg" : "soft";
  return '<div class="card" style="margin-bottom:16px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">' +
      '<div style="font-weight:600;font-size:17px">Общая динамика</div>' +
      '<div class="mono xs soft">' + vals[vals.length - 1] + " " + m.unit + "</div></div>" +
    '<div class="chips" style="margin-bottom:12px">' + METRICS.map(function (x) {
      return '<button class="chip' + (UI.metric === x.id ? " on" : "") + '" data-act="metric:' + x.id + '">' + x.label + "</button>";
    }).join("") + "</div>" +
    '<div class="chartbox">' + chartSVG(vals, labels, "#D48A5F", null, dots) + "</div>" +
    (hasEasy ? '<div class="mono soft" style="font-size:10px;margin-top:4px">зелёные точки — лёгкие тренировки и разгрузочные недели; в объём и подходы они входят</div>' : "") +
    '<div class="mono xs soft" style="display:flex;justify-content:space-between"><span>3 последние тренировки к предыдущим 3</span>' +
      '<span class="' + dcls + '">' + (delta === null ? "—" : (delta > 0 ? "+" : "") + delta + "%") + "</span></div>" +
    '<div class="mono soft" style="font-size:10px;margin-top:4px">' + m.note + "</div></div>";
}
function progressListHTML() {
  var q = UI.query.trim().toLowerCase();
  var items = S.exercises.map(function (ex) {
    var en = entriesFor(ex.id);
    var t = en.length > 1 ? r1(topE(en[en.length - 1]) - topE(en[en.length - 2])) : null;
    return { ex: ex, entries: en, trend: t };
  }).filter(function (it) {
    return (!UI.group || it.ex.group === UI.group) && it.ex.name.toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return b.entries.length - a.entries.length; });

  if (!items.length) return '<div class="empty">ничего не найдено</div>';

  return items.map(function (it) {
    var open = UI.openId === it.ex.id;
    var vals = it.entries.map(function (l) { return r1(topE(l)); });
    var labels = it.entries.map(function (l) { return fmtDate(l.date); });
    var h = '<div class="pcard"><button class="phead" data-act="open:' + it.ex.id + '"><span>' +
      '<span class="exname" style="display:block">' + esc(it.ex.name) + "</span>" +
      '<span class="mono xs soft" style="display:block;margin-top:2px">' +
        (it.entries.length ? it.entries.length + " записей" : "нет записей") + " " + trendHTML(it.trend, "") + "</span></span>" +
      '<span style="display:flex;align-items:center">' + (!open ? sparkSVG(vals) : "") +
      '<span class="caret' + (open ? " open" : "") + '">›</span></span></button>';
    if (open) {
      h += '<div class="pbody"><div class="mono soft" style="font-size:10px;margin-top:8px">расчётный максимум (формула Эпли)</div>';
      var steps = [];
      var bl = blocksFor(it.entries.filter(countsForBlocks));
      var carry = null;
      it.entries.forEach(function (e, i) {
        var hit = null;
        bl.forEach(function (b) { if (e.date >= b.start && e.date <= b.end) hit = r1(b.peak); });
        if (hit !== null) carry = hit;
        steps[i] = carry;
      });
      if (steps.indexOf(null) === 0) {
        var firstVal = steps.filter(function (x) { return x !== null; })[0];
        steps = steps.map(function (x) { return x === null ? firstVal : x; });
      }
      h += vals.length
        ? '<div class="chartbox">' + chartSVG(vals, labels, "#D48A5F", steps.length === vals.length ? steps : null) + "</div>" +
          '<div class="mono soft" style="font-size:10px;margin:-6px 0 10px">оранжевая линия — e1ПМ по тренировкам, зелёные ступеньки — пик блока</div>'
        : '<div class="empty">пока нет записей</div>';
      var st = stagnation(it.entries.filter(countsForBlocks));
      if (st) {
        h += '<div class="mono neg" style="font-size:11px;margin-bottom:8px">застой: блок ' + st.weight +
          " кг закрыт не выше блока " + st.prevWeight + " кг (" + (st.d > 0 ? "+" : "") + st.d +
          "). Обычно это значит, что вес подняли рано или не хватает восстановления.</div>";
      }
      h += blocksHTML(it.entries.filter(countsForBlocks));
      h += '<div class="col8">' + it.entries.slice().reverse().map(function (l) {
        return '<div class="hrow2"><span class="mono sm soft">' + fmtDate(l.date) + '</span><span class="mono sm">' + sumSets(l) + "</span></div>";
      }).join("") + "</div></div>";
    }
    return h + "</div>";
  }).join("");
}

/* ---------- действия ---------- */
function handle(act) {
  var p = act.split(":"), k = p[0], a = p[1], b = p[2];
  if (k === "tab") { UI.tab = a; UI.editing = false; persistUI(); render(); return; }
  if (k === "week") { UI.weekId = a; UI.editing = false; persistUI(); render(); return; }
  if (k === "day") { UI.day = +a; persistUI(); render(); return; }
  if (k === "edit") { UI.editing = !UI.editing; UI.addQuery = ""; render(); return; }
  if (k === "manage") { UI.managing = true; confirmId = null; renderOverlay(); return; }
  if (k === "addweek") {
    var cw = currentWeek();
    var nums = S.weeks.map(function (w) { var m = w.label.match(/\d+/); return m ? +m[0] : 0; });
    var n = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
    var w = { id: uid(), label: "Неделя " + n, days: cw ? JSON.parse(JSON.stringify(cw.days)) : { 1: [], 2: [], 3: [] } };
    S.weeks.push(w); UI.weekId = w.id; UI.day = 1; persist(); persistUI(); render(); return;
  }
  if (k === "up" || k === "down") {
    var w2 = currentWeek(), list = w2.days[UI.day].slice(), i = +a, t = i + (k === "up" ? -1 : 1);
    if (t < 0 || t >= list.length) return;
    var tmp = list[i]; list[i] = list[t]; list[t] = tmp;
    w2.days[UI.day] = list; persist(); render(); return;
  }
  if (k === "rmex") {
    var w3 = currentWeek();
    w3.days[UI.day] = w3.days[UI.day].filter(function (id) { return id !== a; });
    persist(); render(); return;
  }
  if (k === "addex") {
    var w4 = currentWeek();
    if (w4.days[UI.day].indexOf(a) < 0) w4.days[UI.day].push(a);
    UI.addQuery = ""; persist(); render(); return;
  }
  if (k === "addset") {
    var d = getDraft(a), last = d.sets[d.sets.length - 1];
    d.sets.push({ weight: last ? last.weight : "", reps: last ? last.reps : "" });
    d.saved = false; rerenderCard(a); return;
  }
  if (k === "delset") {
    var d2 = getDraft(a);
    d2.sets.splice(+b, 1);
    if (!d2.sets.length) d2.sets.push({ weight: "", reps: "" });
    d2.saved = false; rerenderCard(a); return;
  }
  if (k === "mode") {
    var dm = getDraft(a);
    dm.light = b === "light";
    var ce = currentEntry(a);
    if (ce) { ce.light = dm.light; persist(); }
    rerenderCard(a);
    return;
  }
  if (k === "today") { getDraft(a).date = todayISO(); getDraft(a).saved = false; rerenderCard(a); return; }
  if (k === "save") { saveCard(a); return; }
  if (k === "metric") { UI.metric = a; render(); return; }
  if (k === "group") { UI.group = a === "all" ? null : a; render(); return; }
  if (k === "open") { UI.openId = UI.openId === a ? null : a; document.getElementById("plist").innerHTML = progressListHTML(); return; }
  if (k === "newgroup") { UI.newGroup = a; render(); return; }
  if (k === "addbase") {
    var el = document.getElementById("newname"), name = (el.value || "").trim();
    if (!name) return;
    S.exercises.push({ id: uid(), name: name, group: UI.newGroup, day: null });
    persist(); render(); return;
  }
  if (k === "delbase") {
    S.exercises = S.exercises.filter(function (e) { return e.id !== a; });
    S.logs = S.logs.filter(function (l) { return l.exerciseId !== a; });
    S.weeks.forEach(function (w) { [1, 2, 3].forEach(function (dd) { if (w.days && w.days[dd]) w.days[dd] = w.days[dd].filter(function (id) { return id !== a; }); }); });
    persist(); render(); return;
  }
  if (k === "export") { ioMode = "export"; ioText = JSON.stringify({ exercises: S.exercises, logs: S.logs, weeks: S.weeks }); ioMsg = ""; render(); return; }
  if (k === "importmode") { ioMode = "import"; ioText = ""; ioMsg = ""; render(); return; }
  if (k === "ioclose") { ioMode = null; ioText = ""; render(); return; }
  if (k === "copy") {
    var t2 = document.getElementById("iotext");
    t2.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(ioText).then(function () { ioMsg = "скопировано"; render(); }, function () { ioMsg = "выдели текст и скопируй вручную"; render(); });
    } else { ioMsg = "выдели текст и скопируй вручную"; render(); }
    return;
  }
  if (k === "doimport") {
    try {
      var d3 = JSON.parse(ioText);
      if (!d3.exercises || !d3.logs) throw 0;
      S.exercises = d3.exercises; S.logs = d3.logs; S.weeks = d3.weeks || [];
      drafts = {}; ioMode = null; ioText = "";
      ioMsg = "загружено: " + S.exercises.length + " упражнений, " + S.logs.length + " записей";
      persist(); render();
    } catch (e) { ioMsg = "не получилось прочитать — проверь, что вставлен весь текст"; render(); }
    return;
  }
  if (k === "share") { shareBackup(); return; }
  if (k === "download") { downloadBackup(); return; }
  if (k === "setToday") { setSessionDate(todayISO()); drafts = {}; persist(); render(); return; }
  if (k === "backupnag") { UI.tab = "base"; persistUI(); render(); return; }
  if (k === "restore") { ioMsg = restoreBackup() ? "данные восстановлены из копии" : "копия не найдена"; render(); return; }
  if (k === "hideoffer") { restoreOffer = null; render(); return; }
  if (k === "wmclose") { UI.managing = false; confirmId = null; renderOverlay(); render(); return; }
  if (k === "deload") {
    S.weeks.forEach(function (w) { if (w.id === a) w.deload = !w.deload; });
    persist();
    renderOverlay();
    render();
    return;
  }
  if (k === "wmask") { confirmId = a; renderOverlay(); return; }
  if (k === "wmcancel") { confirmId = null; renderOverlay(); return; }
  if (k === "wmdel") {
    S.weeks = S.weeks.filter(function (w) { return w.id !== a; });
    S.logs = S.logs.filter(function (l) { return l.weekId !== a; });
    if (UI.weekId === a) { var lastw = S.weeks[S.weeks.length - 1]; UI.weekId = lastw ? lastw.id : null; }
    confirmId = null; drafts = {}; persist(); persistUI(); renderOverlay(); render(); return;
  }
}
function saveCard(exId, silent) {
  var d = getDraft(exId);
  var parsed = d.sets.map(function (s) { return { weight: num(s.weight), reps: num(s.reps) }; })
                     .filter(function (s) { return s.weight > 0 && s.reps > 0; });
  if (!parsed.length) return;
  var date = curDate();
  var cur = currentEntry(exId);
  if (cur) { cur.sets = parsed; cur.date = date; cur.light = !!d.light; }
  else S.logs.push({ id: uid(), exerciseId: exId, date: date, sets: parsed, weekId: UI.weekId, day: UI.day, light: !!d.light });
  // одна запись на упражнение и дату
  var seen = false;
  S.logs = S.logs.filter(function (l) {
    if (l.exerciseId !== exId || l.date !== date) return true;
    if (seen) return false;
    seen = true;
    return true;
  });
  d.saved = true;
  persist();
  if (silent) {
    var b = document.querySelector("#card-" + exId + " .save");
    if (b) { b.classList.add("on"); b.textContent = "✓ сохранено"; }
  } else {
    rerenderCard(exId);
  }
}

/* автосохранение через 5 секунд после последнего ввода */
var autoTimers = {};
function scheduleAutosave(exId) {
  if (autoTimers[exId]) clearTimeout(autoTimers[exId]);
  autoTimers[exId] = setTimeout(function () {
    delete autoTimers[exId];
    saveCard(exId, true);
  }, 5000);
}

document.addEventListener("click", function (e) {

  if (t.id === "q") { UI.query = t.value; document.getElementById("plist").innerHTML = progressListHTML(); return; }

  var key = t.dataset.inp;

    S.weeks.forEach(function (w) { if (w.id === id) w.label = t.value; });
    persist();
    return;

  else if (kind === "d") d.date = t.value;

/* импорт из файла */

/* перетаскивание недель */
document.addEventListener("pointerdown", function (e) {
  var h = e.target.closest("[data-handle]");
  if (!h) return;
  e.preventDefault();
  dragIdx = +h.dataset.handle;
  dragStartY = e.clientY;
  var row = document.querySelector('[data-row="' + dragIdx + '"]');
  if (row) { rowH = row.offsetHeight + 8; row.classList.add("drag"); }
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragEnd);
  document.addEventListener("pointercancel", onDragEnd);
});
function onDragMove(e) {
  if (dragIdx === null) return;
  var dy = e.clientY - dragStartY;
  var shift = Math.round(dy / rowH);
  var target = Math.max(0, Math.min(S.weeks.length - 1, dragIdx + shift));
  if (target !== dragIdx) {
    var moved = S.weeks.splice(dragIdx, 1)[0];
    S.weeks.splice(target, 0, moved);
    dragStartY += (target - dragIdx) * rowH;
    dragIdx = target;
    persist();
    renderOverlay();
    var row2 = document.querySelector('[data-row="' + dragIdx + '"]');
    if (row2) { row2.classList.add("drag"); row2.style.transform = "translateY(" + (e.clientY - dragStartY) + "px)"; }
  } else {
    var row3 = document.querySelector('[data-row="' + dragIdx + '"]');
    if (row3) row3.style.transform = "translateY(" + dy + "px)";
  }
}
function onDragEnd() {
  dragIdx = null;
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  document.removeEventListener("pointercancel", onDragEnd);
  renderOverlay();
  render();
}

window.addEventListener("online", renderHead);
window.addEventListener("offline", renderHead);
